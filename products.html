<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنتجات | MKM للأثاث والتصميم</title>
<meta name="description" content="تشكيلة منتجات معرض MKM: كنب، أنتريهات، ركنات، غرف نوم، طاولات ومستلزمات المنزل. الأسعار تُحدَّد من المعرض عند التواصل.">
<meta property="og:title" content="منتجات MKM للأثاث والتصميم">
<meta property="og:description" content="تصفح الكنب والأنتريهات والركنات وكل مستلزمات المنزل من معرض MKM.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header" id="site-header"></header>

<section class="section">
  <div class="container">
    <div class="section-head">
      <h2>منتجات المعرض</h2>
      <p>اختر القسم، ثم اضغط على المنتج لعرض صوره وتفاصيله</p>
      <div class="divider"></div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="grid grid-4" id="list"><div class="state">جارِ التحميل…</div></div>
  </div>
</section>

<footer class="footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
renderChrome("products");
let current = new URLSearchParams(location.search).get("cat") || "all";

const chips = [{ key: "all", label: "الكل" }].concat(CATEGORIES);
document.getElementById("filters").innerHTML = chips.map(c =>
  `<button class="chip" data-k="${c.key}">${c.label}</button>`).join("");

function markChips() {
  $$("#filters .chip").forEach(b => b.classList.toggle("active", b.dataset.k === current));
}

async function load() {
  markChips();
  const box = document.getElementById("list");
  box.innerHTML = `<div class="state">جارِ التحميل…</div>`;
  const { data, error } = await fetchProducts(current);
  if (error) { box.innerHTML = `<div class="state">${esc(error)}</div>`; return; }
  if (!data || !data.length) { box.innerHTML = `<div class="state">لا توجد منتجات في هذا القسم حاليًا.</div>`; return; }
  box.innerHTML = data.map(productCard).join("");
}

$$("#filters .chip").forEach(b => b.addEventListener("click", () => {
  current = b.dataset.k;
  history.replaceState(null, "", current === "all" ? "products.html" : "products.html?cat=" + current);
  load();
}));

load();
</script>
</body>
</html>
